name: golangci-lint
on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          only-new-issues: true
          # Keep equal to the version in tools/go.mod.
          version: v2.14.0
          # The end-to-end suite builds only with this tag.
          args: --build-tags=e2e
