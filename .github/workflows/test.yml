name: Recorder Go Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go caches the module and build caches. This job tests
          # every module, so the key follows each module's dependencies.
          cache-dependency-path: |
            go.sum
            third_party/media-sdk/go.sum
            third_party/samplebuilder/go.sum

      - name: Get dependencies
        run: go mod tidy

      - name: Run the media-sdk copy's tests
        working-directory: third_party/media-sdk
        run: go test -v -race ./...

      - name: Run the samplebuilder copy's tests
        working-directory: third_party/samplebuilder
        run: go test -v -race ./...

      - name: Run tests with coverage
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
        env:
          BBBRECORDER_LOG_LEVEL: DEBUG
          BBBRECORDER_RECORDER_DIRECTORY: /tmp/bbb-webrtc-recorder
          BBBRECORDER_RECORDER_DIRFILEMODE: "0700"
          BBBRECORDER_RECORDER_FILEMODE: "0600"
          BBBRECORDER_PUBSUB_ADAPTER: redis
          BBBRECORDER_PUBSUB_ADAPTERS_REDIS_ADDRESS: ":6379"
          BBBRECORDER_PUBSUB_ADAPTERS_REDIS_NETWORK: tcp
